name: Validate Foundry

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - ".github/workflows/validate-foundry.yml"
  pull_request:
    paths:
      - "**.md"
      - ".github/workflows/validate-foundry.yml"

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify canonical structure
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            test -s "$file" || { echo "::error file=$file::Required canonical file missing or empty"; exit 1; }
          done <<'EOF'
          README.md
          AGENTS.md
          PRODUCT_INVARIANTS.md
          MODERNIZATION_STANDARD.md
          FAILURE_INTELLIGENCE_STANDARD.md
          CHALLENGER_INTEGRATION_STANDARD.md
          PERFORMANCE_ACCEPTANCE.md
          RUNTIME_PROOF.md
          DURABLE_EXECUTION_STANDARD.md
          EVALUATION_STANDARD.md
          OBSERVABILITY_STANDARD.md
          INTEROPERABILITY_STANDARD.md
          AUTHORIZATION_CONTROL_STANDARD.md
          THIRD_PARTY_SKILL_SECURITY.md
          SUPPLY_CHAIN_STANDARD.md
          DISTRIBUTION_STANDARD.md
          SECURITY.md
          registry/protocols.json
          llms.txt
          catalog/SKILLS.md
          docs/ARCHITECTURE.md
          docs/SKILL-AUTHORING.md
          wiki/Home.md
          wiki/_Sidebar.md
          EOF

      - name: Verify invariant anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -qi "Blockers do not close work" PRODUCT_INVARIANTS.md
          grep -qi "Unknown is not absent" PRODUCT_INVARIANTS.md
          grep -qi "Challenge before reinventing" PRODUCT_INVARIANTS.md
          grep -qi "Performance and quality improve together" PRODUCT_INVARIANTS.md
          grep -qi "Continuity is mandatory" PRODUCT_INVARIANTS.md
          grep -qi "Never suffer the same failure twice" PRODUCT_INVARIANTS.md
          grep -qi "Challenger" wiki/_Sidebar.md
          grep -qi "Zero-Loss" wiki/_Sidebar.md
          grep -qi "Interoperability" wiki/_Sidebar.md
          grep -qi "Supply Chain" wiki/_Sidebar.md

      - name: Verify machine-readable registries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("registry/protocols.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["schemaVersion"] == 1
          ids = {x["id"] for x in data["protocols"]}
          required = {"mcp", "a2a", "acp", "ag-ui", "acs"}
          missing = required - ids
          assert not missing, f"missing protocol entries: {sorted(missing)}"
          assert data.get("checkedAt"), "checkedAt is required"
          print("protocol registry OK:", ", ".join(sorted(ids)))
          PY
