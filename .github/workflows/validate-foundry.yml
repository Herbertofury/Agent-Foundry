name: Validate Foundry

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "registry/**"
      - "schemas/**"
      - "receipts/**"
      - "llms.txt"
      - ".github/workflows/validate-foundry.yml"
  pull_request:
    paths:
      - "**.md"
      - "registry/**"
      - "schemas/**"
      - "receipts/**"
      - "llms.txt"
      - ".github/workflows/validate-foundry.yml"

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify canonical structure
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            test -s "$file" || { echo "::error file=$file::Required canonical file missing or empty"; exit 1; }
          done <<'EOF'
          README.md
          AGENTS.md
          PRODUCT_INVARIANTS.md
          MODERNIZATION_STANDARD.md
          FAILURE_INTELLIGENCE_STANDARD.md
          CHALLENGER_INTEGRATION_STANDARD.md
          PERFORMANCE_ACCEPTANCE.md
          RUNTIME_PROOF.md
          DURABLE_EXECUTION_STANDARD.md
          EVALUATION_STANDARD.md
          OBSERVABILITY_STANDARD.md
          INTEROPERABILITY_STANDARD.md
          AUTHORIZATION_CONTROL_STANDARD.md
          THIRD_PARTY_SKILL_SECURITY.md
          SUPPLY_CHAIN_STANDARD.md
          DISTRIBUTION_STANDARD.md
          SECURITY.md
          LICENSING.md
          registry/protocols.json
          schemas/challenger-receipt.schema.json
          schemas/skill-trust-receipt.schema.json
          schemas/eval-case.schema.json
          schemas/release-receipt.schema.json
          receipts/README.md
          llms.txt
          catalog/SKILLS.md
          docs/ARCHITECTURE.md
          docs/SKILL-AUTHORING.md
          wiki/Home.md
          wiki/_Sidebar.md
          EOF

      - name: Verify invariant anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -qi "Blockers do not close work" PRODUCT_INVARIANTS.md
          grep -qi "Unknown is not absent" PRODUCT_INVARIANTS.md
          grep -qi "Challenge before reinventing" PRODUCT_INVARIANTS.md
          grep -qi "Performance and quality improve together" PRODUCT_INVARIANTS.md
          grep -qi "Continuity is mandatory" PRODUCT_INVARIANTS.md
          grep -qi "Never suffer the same failure twice" PRODUCT_INVARIANTS.md
          grep -qi "Challenger" wiki/_Sidebar.md
          grep -qi "Zero-Loss" wiki/_Sidebar.md
          grep -qi "Interoperability" wiki/_Sidebar.md
          grep -qi "Supply Chain" wiki/_Sidebar.md

      - name: Verify machine-readable registries and schemas
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(Path("registry/protocols.json").read_text(encoding="utf-8"))
          assert registry["schemaVersion"] == 1
          ids = {x["id"] for x in registry["protocols"]}
          required = {"mcp", "a2a", "acp", "ag-ui", "acs"}
          assert not (required - ids), f"missing protocol entries: {sorted(required - ids)}"
          assert registry.get("checkedAt"), "protocol registry checkedAt is required"

          for path in sorted(Path("schemas").glob("*.schema.json")):
              data = json.loads(path.read_text(encoding="utf-8"))
              assert data.get("$schema"), f"{path}: $schema missing"
              assert data.get("title"), f"{path}: title missing"
              assert data.get("type") == "object", f"{path}: root type must be object"
              print("schema OK:", path)

          print("protocol registry OK:", ", ".join(sorted(ids)))
          PY
