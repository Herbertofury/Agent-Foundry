name: Validate Skills
# Normalized-head validation trigger: source manifest and skill bridges must already converge.

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "tools/validate_skill_tree.py"
      - ".github/workflows/validate-skills.yml"
  pull_request:
    paths:
      - "skills/**"
      - "tools/validate_skill_tree.py"
      - ".github/workflows/validate-skills.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Foundry deterministic validation
        run: |
          python tools/validate_skill_tree.py skills
          python tools/source_manifest.py --root skills --check
          python skills/ultimate-agent-governance/scripts/audit_cross_skill_constitution.py skills
          python tools/normalize_skill_mirror.py --root skills
          git diff --exit-code -- skills SOURCE_MANIFEST.json

      - name: Install pinned Agent Skills reference validator
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/agentskills/agentskills.git /tmp/agentskills
          git -C /tmp/agentskills checkout 69ef37e9424c0a7ea9dd2293b559e43ec8176379
          python -m pip install /tmp/agentskills/skills-ref

      - name: Agent Skills specification compatibility
        shell: bash
        run: |
          set -euo pipefail
          for skill in skills/*; do
            test -f "$skill/SKILL.md" || continue
            echo "::group::skills-ref $(basename "$skill")"
            skills-ref validate "$skill"
            echo "::endgroup::"
          done

      - name: Install pinned Cisco AI Defense Skill Scanner
        run: python -m pip install "cisco-ai-skill-scanner==2.1.0"

      - name: Security scan flagship Skills
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          skill-scanner scan-all ./skills             --recursive             --check-overlap             --format sarif             --output skill-scan.sarif

      - name: Require scanner report
        shell: bash
        run: |
          test -s skill-scan.sarif || {
            echo "::error::Skill Scanner did not produce a SARIF report"
            exit 1
          }

      - name: Upload Skill Scanner SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: skill-scan.sarif

      - name: Record scanner trust boundary
        run: |
          echo "Cisco AI Defense Skill Scanner passed the current flagship source."
          echo "A clean scanner result is evidence, not a guarantee of safety; provenance, review, permissions, evals, and runtime controls remain required."
